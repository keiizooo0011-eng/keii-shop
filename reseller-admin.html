<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Reseller KivoPay</title><link rel="stylesheet" href="reseller-admin.css?v=34"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script></head><body><header><a href="admin.html">← Admin Panel</a><div><strong>Reseller Center</strong><small>Katalog reseller berdiri sendiri</small></div><a href="reseller.html">Lihat Reseller</a></header><main>
<section class="card"><div class="head"><div><small>PENGATURAN</small><h2>Pendaftaran Reseller</h2></div><button id="saveSettings">Simpan</button></div><div class="form-grid"><label>Harga bergabung<input id="joinPrice" type="number" min="0"></label><label>Judul<input id="settingTitle"></label><label class="wide">Subjudul<input id="settingSubtitle"></label><label class="toggle"><input id="registrationOpen" type="checkbox"><span>Pendaftaran dibuka</span></label></div></section>
<section class="card"><div class="head"><div><small>KATALOG TERPISAH</small><h2 id="productFormTitle">Tambah Produk Reseller</h2><p>Produk ini tidak mengambil katalog user.</p></div><button id="resetProduct" type="button">Produk Baru</button></div><input id="editingId" type="hidden"><div class="product-editor">
<label class="image-uploader">Foto produk<img id="imagePreview" src="icons/icon-512.png" alt="Preview"><input id="productImage" type="file" accept="image/*"></label>
<div class="product-fields"><label>Nama produk<input id="productName" placeholder="Contoh: Netflix Crack Reseller"></label><label>Kategori<select id="productCategory"><option value="apk-premium">APK Premium</option><option value="bot">Bot / Tools</option><option value="digital">Produk Digital</option></select></label><label>Harga reseller<input id="productPrice" type="number" min="0"></label><label>Stok / slot<input id="productStock" type="number" min="0"></label><label>Mode pengiriman<select id="deliveryMode"><option value="manual">Manual / diproses admin</option><option value="automatic">Otomatis dari stok akun</option></select></label><label class="toggle"><input id="requiresEmail" type="checkbox"><span>Wajib email aktif</span></label><label>Urutan<input id="sortOrder" type="number" value="0"></label><label class="toggle"><input id="activeProduct" type="checkbox" checked><span>Produk aktif</span></label><label class="wide">Deskripsi<textarea id="productDescription" rows="4"></textarea></label><label class="wide">Teks promo<input id="promoText" placeholder="Benefit singkat untuk reseller"></label><label class="wide">Varian (satu baris: Nama|Harga)<textarea id="productVariants" rows="4" placeholder="1 Bulan|15000\n2 Bulan|28000"></textarea></label><label class="wide" id="stockDataWrap">Stok akun otomatis (satu baris: varian|email|password|catatan)<textarea id="stockData" rows="5"></textarea></label><button id="saveProduct" class="primary wide">Simpan Produk Reseller</button></div></div><div id="productList" class="list product-list"></div></section>
<section class="card"><div class="head"><div><small>ORDER</small><h2>Pesanan Reseller</h2></div><button id="refreshOrders">Refresh</button></div><div id="orderList" class="list"></div></section>
<section class="card"><div class="head"><div><small>MEMBER</small><h2>Daftar Reseller</h2></div></div><div id="memberList" class="list"></div></section>
</main><script src="reseller-admin.js?v=34"></script></body></html>

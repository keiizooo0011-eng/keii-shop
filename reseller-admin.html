<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Reseller KivoPay</title><link rel="stylesheet" href="reseller-admin.css?v=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script></head><body><header><a href="admin.html">← Admin Panel</a><div><strong>Reseller Center</strong><small>Kelola akses, biaya, dan katalog reseller</small></div><a href="reseller-dashboard.html">Lihat Dashboard</a></header><main>
<section class="card"><div class="head"><div><small>PENGATURAN</small><h2>Pendaftaran Reseller</h2></div><button id="saveSettings">Simpan</button></div><div class="form-grid"><label>Harga bergabung<input id="joinPrice" type="number" min="0"></label><label>Judul<input id="settingTitle"></label><label class="wide">Subjudul<input id="settingSubtitle"></label><label class="toggle"><input id="registrationOpen" type="checkbox"><span>Pendaftaran dibuka</span></label></div></section>
<section class="card"><div class="head"><div><small>KATALOG</small><h2>Produk Harga Reseller</h2></div></div><div class="product-form"><label>Produk<select id="productSelect"></select></label><label>Harga reseller<input id="resellerPrice" type="number" min="0"></label><label>Urutan<input id="sortOrder" type="number" value="0"></label><label class="wide">Teks promo<input id="promoText" placeholder="Contoh: Harga khusus untuk reseller aktif"></label><label class="toggle"><input id="exclusiveProduct" type="checkbox"><span>Hanya tampil di reseller</span></label><label class="toggle"><input id="activeProduct" type="checkbox" checked><span>Produk aktif</span></label><button id="saveProduct">Tambahkan / Update</button></div><div id="productList" class="list"></div></section>
<section class="card"><div class="head"><div><small>MEMBER</small><h2>Daftar Reseller</h2></div></div><div id="memberList" class="list"></div></section>
</main><script src="reseller-admin.js?v=1"></script></body></html>
